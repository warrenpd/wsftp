[project]
name = "wsftp"
version = "1.0.0"
description = "Command-line SFTP client: copy files and directory trees, optionally only those changed since a given date/time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.4"]

[project.scripts]
wsftp = "wsftp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
